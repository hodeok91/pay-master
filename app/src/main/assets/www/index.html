<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <title>페이의 달인</title>
  <link rel="stylesheet" href="./core/theme/base.css"/>
  <link rel="stylesheet" href="./core/cards/dalin-card.css"/>
  <link rel="stylesheet" href="./core/tutorial/tip.css"/>
  <link rel="stylesheet" href="./pays/samsung/samsung.css"/>
</head>
<body>
  <main id="app">
    <section style="height:100vh;background:#000;color:#fff;display:grid;place-items:center;font-family:sans-serif">
      <div style="text-align:center">
        <div style="font-size:36px;font-weight:900">페이의 달인</div>
        <div style="margin-top:12px;color:#999">앱을 불러오는 중...</div>
      </div>
    </section>
  </main>
  <div id="tip-layer" aria-live="polite"></div>

  <script>
    window.addEventListener("error", function (event) {
      var app = document.getElementById("app");
      if (!app) return;
      app.innerHTML =
        '<section style="height:100vh;background:#000;color:#fff;padding:48px 24px;font-family:sans-serif">' +
        '<h1>페이의 달인</h1>' +
        '<p style="color:#ff8b8b;font-weight:700">화면을 불러오지 못했습니다.</p>' +
        '<p style="color:#aaa;font-size:14px;word-break:break-all">' +
        String(event.message || "JavaScript load error") +
        '</p></section>';
    });
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
